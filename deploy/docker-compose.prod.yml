# Ishlab chiqarish: postgres + redis + backend + frontend(nginx) + kunlik zaxira.
# Ishga tushirish (backend/deploy ichida):  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# HTTPS: serverdagi Nginx + certbot orqali (nginx-site.conf.example), konteyner faqat 127.0.0.1 da ochiladi
# Frontend repo backend bilan yonma-yon bo'lishi kerak: ../../frontend
name: xostavar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xostavar}
      POSTGRES_USER: ${DB_USER:-xostavar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env.prod da berilishi shart}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-xostavar} -d ${DB_NAME:-xostavar}']
      interval: 5s
      timeout: 3s
      retries: 20
    # Port tashqariga ochilmaydi — faqat ichki tarmoq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${DB_USER:-xostavar}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-xostavar}
      REDIS_URL: redis://redis:6379
      SEED_DEMO: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - '3000'

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${HTTP_PORT:-8700}:80'

  # Zaxira: har kuni BACKUP_TIMES soatlarida (Toshkent) pg_dump → ./backups (+ Telegram), BACKUP_KEEP_DAYS kundan eskisi o'chiriladi.
  # Qo'lda: ./backup-now.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-xostavar}
      DB_USER: ${DB_USER:-xostavar}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_TIMES: ${BACKUP_TIMES:-14:00 22:00}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - |
        apk add --no-cache -q curl >/dev/null 2>&1 || echo "curl o'rnatilmadi — Telegram ishlamaydi"
        echo "zaxira vaqtlari: $$BACKUP_TIMES (Asia/Tashkent); telegram: $${TELEGRAM_CHAT_ID:+yoqilgan}$${TELEGRAM_CHAT_ID:-o'chiq}"
        last=""
        while true; do
          now=$$(date +%H:%M); today=$$(date +%Y%m%d)
          for t in $$BACKUP_TIMES; do
            if [ "$$now" = "$$t" ] && [ "$$last" != "$$today-$$t" ]; then last="$$today-$$t"; sh /backup.sh; fi
          done
          sleep 20
        done

volumes:
  pgdata:
  redisdata:
