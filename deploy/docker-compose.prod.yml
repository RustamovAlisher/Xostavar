# Ishlab chiqarish: postgres + redis + backend + frontend(nginx) + kunlik zaxira.
# Ishga tushirish (backend/deploy ichida):  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# HTTPS: serverdagi Nginx + certbot orqali (nginx-site.conf.example), konteyner faqat 127.0.0.1 da ochiladi
# Frontend repo backend bilan yonma-yon bo'lishi kerak: ../../frontend
name: xostavar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xostavar}
      POSTGRES_USER: ${DB_USER:-xostavar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env.prod da berilishi shart}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-xostavar} -d ${DB_NAME:-xostavar}']
      interval: 5s
      timeout: 3s
      retries: 20
    # Port tashqariga ochilmaydi — faqat ichki tarmoq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${DB_USER:-xostavar}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-xostavar}
      REDIS_URL: redis://redis:6379
      SEED_DEMO: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - '3000'

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${HTTP_PORT:-8083}:80'

  # Kunlik pg_dump: ./backups ichiga, BACKUP_KEEP_DAYS kundan eskisi o'chiriladi (standart 14)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-xostavar}
      DB_USER: ${DB_USER:-xostavar}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Tashkent
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          f=/backups/xostavar-$(date +%Y%m%d-%H%M).dump
          if pg_dump -h postgres -U "$$DB_USER" -d "$$DB_NAME" -Fc -f "$$f"; then echo "zaxira: $$f"; else echo "zaxira XATO"; fi
          find /backups -name 'xostavar-*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  pgdata:
  redisdata:
