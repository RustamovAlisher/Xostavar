services:
  postgres:
    image: postgres:16-alpine
    container_name: xostavar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xostavar}
      POSTGRES_USER: ${DB_USER:-xostavar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xostavar}
      TZ: Asia/Tashkent
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-xostavar} -d ${DB_NAME:-xostavar}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xostavar-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
